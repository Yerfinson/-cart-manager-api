# Context: ITAC CoE git hooks via lefthook - backend
# commit-msg: validates Smart Commits format
# pre-commit: runs ESLint + Prettier check
# pre-push: runs unit tests with 90% coverage (ITAC CoE requirement)

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --config commitlint.config.cjs --edit {1}

pre-commit:
  commands:
    eslint:
      glob: '*.ts'
      run: npx eslint {staged_files}
    prettier:
      glob: '*.{ts,json}'
      run: npx prettier --check {staged_files}

pre-push:
  commands:
    tests:
      run: npm run test:ci
